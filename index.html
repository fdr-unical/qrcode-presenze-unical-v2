<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presenze in Aula - UniCal</title>
  <meta name="description" content="Sistema QR dinamico anti-condivisione per rilevamento presenze Università della Calabria">
  <!-- qrcodejs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
      padding: 20px;
    }

    header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    header p {
      font-size: 1.2rem;
      opacity: 0.9;
    }

    main {
      background: white;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }

    .config-section {
      margin-bottom: 30px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 10px;
    }

    .config-section h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 1.5rem;
    }

    .config-group {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 15px;
    }

    label {
      font-weight: 600;
      color: #333;
      font-size: 1.1rem;
    }

    input[type="url"], input[type="number"], input[type="password"] {
      padding: 12px 15px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.3s;
    }

    input[type="url"]:focus, input[type="number"]:focus, input[type="password"]:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    input[type="url"] {
      font-family: monospace;
    }

    .qr-section {
      text-align: center;
      padding: 30px 20px;
      background: #f8f9fa;
      border-radius: 10px;
      margin-bottom: 30px;
    }

    .qr-section h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 1.5rem;
    }

    #qrcode {
      display: inline-block;
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      margin: 20px 0;
    }

    #status {
      font-size: 1.1rem;
      font-weight: 500;
      margin-top: 15px;
    }

    .log-section {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 25px;
    }

    .log-section h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 1.5rem;
    }

    #exportBtn {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
      margin-bottom: 20px;
    }

    #exportBtn:hover {
      background: #5a6fd8;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    #logContainer {
      max-height: 300px;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
    }

    .log-entry {
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 5px;
      font-family: monospace;
      font-size: 0.9rem;
    }

    .log-entry.info {
      background: #e3f2fd;
      color: #1976d2;
    }

    .log-entry.success {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .log-entry.error {
      background: #ffebee;
      color: #c62828;
    }

    footer {
      text-align: center;
      color: white;
      padding: 20px;
      font-size: 0.9rem;
      opacity: 0.8;
    }

    @media (max-width: 768px) {
      main {
        padding: 20px;
      }
      
      header h1 {
        font-size: 2rem;
      }
      
      .config-section, .qr-section, .log-section {
        padding: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎓 Presenze in Aula</h1>
      <p>Università della Calabria</p>
    </header>

    <main>
      <section aria-label="Configurazione" class="config-section">
        <h2>⚙️ Configurazione</h2>
        
        <div class="config-group">
          <label for="form-url">URL Form Microsoft</label>
          <input type="password" id="form-url" placeholder="Inserisci URL form (nascosto)" required 
                 aria-describedby="url-hint" autocomplete="off">
          <small id="url-hint">⚠️ L'URL non sarà visibile agli studenti</small>
        </div>

        <div class="config-group">
          <label for="period">Durata QR (secondi)</label>
          <input type="number" id="period" value="60" min="30" max="180" step="15">
        </div>

        <div class="config-group">
          <label for="tolerance">Tolleranza (±N periodi)</label>
          <input type="number" id="tolerance" value="1" min="0" max="5">
        </div>
      </section>

      <section class="qr-section">
        <h2>📱 QR Code</h2>
        <div id="qrcode"></div>
        <p id="status">Genera il QR Code per iniziare</p>
      </section>

      <section class="log-section">
        <h2>📝 Log Scansioni</h2>
        <button id="exportBtn">Esporta Log</button>
        <div id="logContainer"></div>
      </section>
    </main>

    <footer>
      <p>Università della Calabria &copy; 2026 • Sistema di Presenze QR Code</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
